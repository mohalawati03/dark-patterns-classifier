<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dark Patterns Classifier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 28px;
      margin-top: 10vh;
      margin-bottom: 20px;
      background: linear-gradient(to right, #5f4dee, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #formDiv {
      width: 80%;
      max-width: 800px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .custom-file-input {
      display: inline-block;
      padding: 8px 14px;
      font-size: 14px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background-color: #f8f8ff;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }

    .custom-file-input:hover {
      background-color: #e0e0ff;
    }

    .primary-button {
      margin-top: 10px;
      padding: 10px 30px;
      font-size: 16px;
      background-color: #5f4dee;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-button:hover {
      background-color: #4c39c6;
    }

    #spinner {
      display: none;
      margin: 30px auto;
      text-align: center;
    }

    #spinner .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #5f4dee;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    #spinner .dot:nth-child(2) { animation-delay: 0.2s; }
    #spinner .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .classification-label {
      font-size: 24px;
      font-weight: bold;
      margin: 20px auto 10px;
      text-align: center;
    }

    .dark { color: #c0392b; }
    .safe { color: #27ae60; }

    .explanation {
      margin: 5px auto 30px;
      max-width: 700px;
      text-align: left;
      font-size: 15px;
      line-height: 1.5;
    }

    .explanation ul {
      padding-left: 20px;
      list-style-type: disc;
    }

    .explanation li {
      margin-bottom: 10px;
    }

    #results {
      width: 80%;
      max-width: 800px;
    }

    .center-button {
      display: block;
      margin: 20px auto 40px;
      padding: 10px 25px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background-color: #5f4dee;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Dark Patterns Privacy Classifier</h1>

  <div id="formDiv">
    <form id="explanationForm">
      <textarea id="textarea" placeholder="Paste your privacy policies here..." required></textarea>
      <br />
      <label class="custom-file-input">
        Choose PDF File
        <input type="file" id="pdfUpload" accept="application/pdf" hidden />
      </label>
      <br />
      <input type="submit" class="primary-button" value="Classify Policies" />
    </form>
  </div>

  <div id="spinner">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <p style="font-style: italic; color: #666; margin-top: 6px;">Thinking...</p>
  </div>

  <div id="results"></div>

  <script>
  let inputText = "";
  let briefed = false;

  document.getElementById("explanationForm").addEventListener("submit", submitForm);
  document.getElementById("textarea").addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("explanationForm").requestSubmit();
    }
  });

  async function submitForm(event) {
    event.preventDefault();
    inputText = document.getElementById("textarea").value.trim();
    if (!inputText) return;

    document.getElementById("textarea").value = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("spinner").style.display = "block";
    await fetchAndRead("brief");
  }

  async function fetchAndRead(mode) {
    const resultsDiv = document.getElementById("results");
    const spinner = document.getElementById("spinner");

    if (briefed) {
      briefed = false;
      const button = document.getElementById("button");
      if (button) button.remove();
    }

    try {
      const response = await fetch(`http://localhost:8000/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: inputText }),
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let accumulatedText = "";

      async function read() {
        const { done, value } = await reader.read();
        if (done) {
          spinner.style.display = "none";
          if (mode === "brief" && !briefed) {
            briefed = true;
            createDetailedButton();
          }
          return;
        }

        accumulatedText += decoder.decode(value, { stream: true });
        const lines = accumulatedText.split("\n\n\n");
        accumulatedText = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;

          try {
            const policy = JSON.parse(line);

            // Show the original policy text
            const policyBlock = document.createElement("p");
            policyBlock.textContent = policy.policy;
            resultsDiv.appendChild(policyBlock);

            // Classification label (Dark or Safe)
            const classElem = document.createElement("div");
            classElem.classList.add("classification-label");
            classElem.classList.add(policy.classification.toLowerCase() === "dark" ? "dark" : "safe");
            classElem.textContent = policy.classification;
            resultsDiv.appendChild(classElem);

            // Explanation as bullet points
            const explainBox = document.createElement("div");
            explainBox.classList.add("explanation");
            const ul = document.createElement("ul");

            policy.explanation.split(/\n|•|-/).forEach((point) => {
              const trimmed = point.trim();
              if (trimmed.length > 0 && trimmed.length > 10) {
                const li = document.createElement("li");
                li.textContent = trimmed;
                ul.appendChild(li);
              }
            });

            explainBox.appendChild(ul);
            resultsDiv.appendChild(explainBox);
          } catch (e) {
            console.error("Failed to parse line", line, e);
          }
        }

        await read();
      }

      await read();
    } catch (error) {
      document.getElementById("results").innerHTML = "<p style='color:red;'>Error: Could not classify.</p>";
      spinner.style.display = "none";
      console.error("Fetch error:", error);
    }
  }

  function createDetailedButton() {
    const div = document.getElementById("results");
    const button = document.createElement("button");
    button.id = "button";
    button.className = "primary-button center-button";
    button.textContent = "Detailed Explanation";
    button.onclick = async () => {
      document.getElementById("spinner").style.display = "block";
      document.getElementById("results").innerHTML = "";
      await fetchAndRead("detailed");
    };
    div.appendChild(button);
  }
</script>

</body>
</html>
